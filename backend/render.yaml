services:
  - type: web
    name: godlouange-portfolio-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CHAT_MODEL
        value: gemini-2.5-flash
      - key: ALLOWED_ORIGINS
        value: https://godlouange.github.io
